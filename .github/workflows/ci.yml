name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: collabai
          POSTGRES_PASSWORD: collabai
          POSTGRES_DB: collabai_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U collabai -d collabai_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://collabai:collabai@localhost:5432/collabai_ci?schema=public
      DIRECT_URL: postgresql://collabai:collabai@localhost:5432/collabai_ci?schema=public
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # This suite includes the refresh-token integration test. DATABASE_URL above
      # explicitly targets this job's disposable PostgreSQL service.
      - run: npm test -- --runInBand
