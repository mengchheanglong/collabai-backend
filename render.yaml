# Render Blueprint Specification for CollabAI Backend & Managed Database
# Docs: https://render.com/docs/blueprint-spec

services:
  # ==========================================
  # CollabAI API (NestJS Web Service)
  # ==========================================
  - type: web
    name: collabai-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: pnpm install && pnpm exec prisma generate && pnpm run build
    startCommand: export DIRECT_URL="${DIRECT_URL:-$DATABASE_URL}" && pnpm exec prisma db push --skip-generate && node dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: collabai-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: collabai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: COOKIE_SAME_SITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
      - key: AI_PROVIDER
        value: stub
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  # ==========================================
  # CollabAI PostgreSQL Database
  # ==========================================
  - name: collabai-db
    databaseName: collabai
    user: collabai_user
    plan: free
    region: oregon
